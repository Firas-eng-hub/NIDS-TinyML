<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NIDS Dashboard</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:        #0d1117;
        --surface:   #161b22;
        --surface2:  #1c2333;
        --border:    #30363d;
        --text:      #e6edf3;
        --muted:     #8b949e;
        --accent:    #388bfd;

        --normal:    #3fb950;
        --dos:       #f85149;
        --brute:     #d29922;
        --botnet:    #bc8cff;
        --web:       #ff7b72;
        --unknown:   #8b949e;
      }

      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
      }

      /* ── Header ── */
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 28px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .logo-icon {
        width: 34px; height: 34px;
        background: var(--accent);
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; flex-shrink: 0;
      }
      header h1 { font-size: 18px; font-weight: 600; letter-spacing: .3px; }
      header .sub { font-size: 12px; color: var(--muted); }
      .spacer { flex: 1; }
      .live-badge {
        display: flex; align-items: center; gap: 7px;
        font-size: 13px; color: var(--normal);
        background: rgba(63,185,80,.12);
        border: 1px solid rgba(63,185,80,.3);
        border-radius: 20px; padding: 5px 12px;
      }
      .pulse {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--normal);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,100% { opacity: 1; transform: scale(1); }
        50%      { opacity: .4; transform: scale(.7); }
      }
      .refresh-countdown { font-size: 12px; color: var(--muted); }

      /* ── Layout ── */
      .container { padding: 24px 28px; max-width: 1400px; margin: 0 auto; }

      /* ── Stat cards ── */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin-bottom: 24px;
      }
      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px 20px;
        position: relative;
        overflow: hidden;
      }
      .stat-card::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: var(--card-accent, var(--accent));
      }
      .stat-card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
      .stat-card .value { font-size: 32px; font-weight: 700; line-height: 1; }
      .stat-card .delta { font-size: 12px; color: var(--muted); margin-top: 6px; }

      /* ── Main grid ── */
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 20px;
        margin-bottom: 24px;
      }
      @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

      /* ── Panel ── */
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .panel-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        font-size: 14px; font-weight: 600;
      }
      .panel-body { padding: 18px; }

      /* ── Chart ── */
      .chart-wrap { position: relative; height: 220px; }

      /* ── Filters ── */
      .filters {
        display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
        margin-bottom: 16px;
      }
      .filter-group { display: flex; flex-direction: column; gap: 4px; }
      .filter-group label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
      select, input[type="number"] {
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 10px;
        font-size: 13px;
        outline: none;
        transition: border-color .15s;
      }
      select:focus, input:focus { border-color: var(--accent); }
      .btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 13px;
        cursor: pointer;
        font-weight: 500;
        transition: opacity .15s;
      }
      .btn:hover { opacity: .85; }

      /* ── Table ── */
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      thead th {
        background: var(--surface2);
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .5px;
        padding: 10px 14px;
        text-align: left;
        white-space: nowrap;
        border-bottom: 1px solid var(--border);
      }
      tbody tr {
        border-bottom: 1px solid rgba(48,54,61,.6);
        transition: background .1s;
      }
      tbody tr:hover { background: var(--surface2); }
      tbody td { padding: 10px 14px; vertical-align: middle; }
      .ts { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }

      /* ── Badges ── */
      .badge {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .3px;
      }
      .badge-Normal    { background: rgba(63,185,80,.15);  color: var(--normal);  border: 1px solid rgba(63,185,80,.3);  }
      .badge-DoS       { background: rgba(248,81,73,.15);  color: var(--dos);     border: 1px solid rgba(248,81,73,.3);  }
      .badge-BruteForce{ background: rgba(210,153,34,.15); color: var(--brute);   border: 1px solid rgba(210,153,34,.3); }
      .badge-Botnet    { background: rgba(188,140,255,.15);color: var(--botnet);  border: 1px solid rgba(188,140,255,.3);}
      .badge-WebAttack { background: rgba(255,123,114,.15);color: var(--web);     border: 1px solid rgba(255,123,114,.3);}
      .badge-Unknown   { background: rgba(139,148,158,.15);color: var(--unknown); border: 1px solid rgba(139,148,158,.3);}

      /* ── Confidence bar ── */
      .conf-wrap { display: flex; align-items: center; gap: 8px; }
      .conf-bar-bg {
        flex: 1; height: 6px; border-radius: 3px;
        background: var(--surface2);
        min-width: 60px;
      }
      .conf-bar-fill { height: 100%; border-radius: 3px; transition: width .3s; }
      .conf-val { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

      /* ── Features cell ── */
      .features-cell {
        font-size: 11px; color: var(--muted);
        max-width: 260px; overflow: hidden;
        text-overflow: ellipsis; white-space: nowrap;
      }

      /* ── Empty / error states ── */
      .empty-row td {
        text-align: center; padding: 40px;
        color: var(--muted); font-size: 14px;
      }

      /* ── Legend ── */
      .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 14px; }
      .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
      .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header>
      <div class="logo-icon">&#x1F6E1;</div>
      <div>
        <h1>NIDS Dashboard</h1>
        <div class="sub">Network Intrusion Detection System &mdash; STM32</div>
      </div>
      <div class="spacer"></div>
      <span class="refresh-countdown" id="countdown"></span>
      <div class="live-badge"><div class="pulse"></div>Live</div>
    </header>

    <div class="container">
      <!-- Stat cards -->
      <div class="stats-grid">
        <div class="stat-card" style="--card-accent: var(--accent)">
          <div class="label">Total Alerts</div>
          <div class="value" id="statTotal">0</div>
          <div class="delta" id="statTotalSub">all classes</div>
        </div>
        <div class="stat-card" style="--card-accent: var(--dos)">
          <div class="label">Attacks Detected</div>
          <div class="value" id="statAttacks">0</div>
          <div class="delta">non-normal events</div>
        </div>
        <div class="stat-card" style="--card-accent: var(--normal)">
          <div class="label">Normal Traffic</div>
          <div class="value" id="statNormal">0</div>
          <div class="delta">benign flows</div>
        </div>
        <div class="stat-card" style="--card-accent: var(--brute)">
          <div class="label">Attack Rate</div>
          <div class="value" id="statRate">0%</div>
          <div class="delta">of total traffic</div>
        </div>
      </div>

      <!-- Chart + breakdown -->
      <div class="main-grid">
        <div class="panel">
          <div class="panel-header">
            <span>Alerts by Class</span>
          </div>
          <div class="panel-body">
            <div class="chart-wrap">
              <canvas id="alertsChart"></canvas>
            </div>
            <div class="legend" id="chartLegend"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header"><span>Class Breakdown</span></div>
          <div class="panel-body" id="classBreakdown" style="padding:0;"></div>
        </div>
      </div>

      <!-- Alerts table -->
      <div class="panel">
        <div class="panel-header">
          <span>Recent Alerts</span>
          <span id="tableCount" style="font-size:12px;color:var(--muted);font-weight:400;"></span>
        </div>
        <div class="panel-body">
          <div class="filters">
            <div class="filter-group">
              <label for="classFilter">Class</label>
              <select id="classFilter">
                <option value="">All</option>
                <option value="Normal">Normal</option>
                <option value="DoS">DoS</option>
                <option value="BruteForce">BruteForce</option>
                <option value="Botnet">Botnet</option>
                <option value="WebAttack">WebAttack</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="minConfidence">Min Confidence</label>
              <input id="minConfidence" type="number" step="0.05" min="0" max="1" value="0" style="width:110px;" />
            </div>
            <div class="filter-group">
              <label>&nbsp;</label>
              <button class="btn" id="refreshBtn">&#x21BB; Refresh</button>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>Class</th>
                  <th>Confidence</th>
                  <th>Flow ID</th>
                  <th>Key Features</th>
                </tr>
              </thead>
              <tbody id="alertsTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="/static/dashboard.js"></script>
  </body>
</html>
